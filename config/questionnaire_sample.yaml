# yaml-language-server: $schema=../docs/questionnaire.schema.json
#
# ──────────────────────────────────────────────────────────────────────────────
# umfrage — Questionnaire Sample Configuration
# ──────────────────────────────────────────────────────────────────────────────
#
# This file is an annotated template for creating questionnaire configurations.
# Copy it to questionnaire.yaml (which is gitignored) and edit to fit your needs.
#
# TIP: Add the yaml-language-server line above as the first line of your YAML
#      file to enable IDE autocompletion and inline validation in VS Code
#      (requires the YAML extension by Red Hat).
#
# Run a syntax/completeness check at any time:
#   umfrage validate config/questionnaire.yaml
#
# Generate the Excel questionnaire:
#   umfrage generate config/questionnaire.yaml --metadata-file
# ──────────────────────────────────────────────────────────────────────────────

# ── Questionnaire identity ────────────────────────────────────────────────────

# Title displayed as the large header in the generated Excel file.
# Also used to derive the output filename slug (e.g. "annual-cooperation-survey").
title: "Annual Cooperation Survey 2024"

# Version string — increment this when you change questions after distributing
# so the collector can detect mismatches.
version: "1.0"

# Language for all static UI labels in the generated Excel file.
# Controls column headers (ID, Question, Answer, Scale / Comment),
# section labels, yes/no dropdown values, and result-sheet headers.
# Available built-in codes: "en" (English), "de" (German).
# Add umfrage/i18n/<code>.yaml to register additional languages.
# Default: "en"
language: "en"
# language: "de"    # Uncomment for a German questionnaire

# ── Organizer information ─────────────────────────────────────────────────────

# Information about the person or organisation running the survey.
# Shown in the organizer info row of the Excel questionnaire.
organizer:
  name: "Dr. Jane Smith"              # Full name of the organizer
  institution: "Research Institute XYZ" # Institution or organisation name
  email: "j.smith@xyz-institute.org"  # Contact email (must be a valid format)
  phone: "+49 89 12345-678"           # Optional contact phone number
  # phone: null                       # Set to null or omit if not available

# ── Respondent information fields ─────────────────────────────────────────────

# Each respondent fills these fields in before answering the questions.
# At least one field is required.
# TIP: Include an "Institution" field — the collector uses it as the column
#      header in the result spreadsheet.
respondent_fields:
  - label: "Name"           # Display label shown next to the input cell
    required: true          # True by default; false means the field may be left blank
  - label: "Institution"
    required: true
  - label: "Email"
    required: false         # Optional field — respondents may leave this blank

# ── Sections and questions ────────────────────────────────────────────────────
#
# Sections group related questions. Each section gets a colored header row
# in the Excel file.
#
# Each question needs:
#   id     – globally unique slug (letters, digits, dots, hyphens, underscores)
#   text   – the full question text shown to respondents
#   answer – type and constraints (see below for all types)
#   comment  – optional extra context / scale labels shown in the Comment column
#   required – whether the question must be answered (default: true)
#
# ANSWER TYPES:
#   scale    – integer in [min_value, max_value]; dropdown validates the range
#   yes_no   – "Yes" or "No" dropdown; no min/max values needed
#   freetext – any text; no data validation applied
#   choices  – one of a fixed set of options; shown as a dropdown in Excel
#              Define options inline with `choices: [...]`, or reference a
#              named list from `choice_lists` (below) with `choices_ref: name`.
#              `show_choices_in_comment: false` suppresses the auto-generated
#              option list from column D. Only meaningful when no `comment` is
#              set on the question (an explicit comment is always a complete
#              override and already hides the list, making the flag redundant).
# ─────────────────────────────────────────────────────────────────────────────

# ── Reusable choice lists ─────────────────────────────────────────────────────
#
# Define named option lists here and reference them anywhere with
# `choices_ref: <name>`. This avoids repeating the same list for several
# questions. You can still define one-off lists inline per question.
#
# Rules:
#   • At least 2 options per list.
#   • The comma-joined options must not exceed 255 characters total
#     (Excel data-validation formula limit). Shorten labels if needed.
#   • Option strings must be unique within a list (case-insensitive).
# ──────────────────────────────────────────────────────────────────────────────
choice_lists:
  frequency:
    - "Never"
    - "Rarely"
    - "Sometimes"
    - "Often"
    - "Always"
  satisfaction_level:
    - "Very dissatisfied"
    - "Dissatisfied"
    - "Neutral"
    - "Satisfied"
    - "Very satisfied"

sections:
  # ── Section 1: General Satisfaction ────────────────────────────────────────
  - title: "General Satisfaction"
    questions:
      - id: "GEN.Q1"
        text: "How satisfied are you with the overall cooperation over the past year?"
        answer:
          type: scale
          min_value: 1
          max_value: 5
          description: "1 = not satisfied at all, 5 = very satisfied"
        # comment overrides the auto-generated scale hint
        comment: "1 = not satisfied, 3 = neutral, 5 = very satisfied"
        required: true

      - id: "GEN.Q2"
        text: "Would you be willing to continue this cooperation next year?"
        answer:
          type: yes_no
        required: true

      - id: "GEN.Q3"
        text: "Please share any additional comments on the general cooperation."
        answer:
          type: freetext
          description: "Free text, max. 3–4 sentences"
        required: false  # Optional — respondents may leave this blank

      - id: "GEN.Q4"
        text: "How would you describe the overall quality of the cooperation?"
        answer:
          type: choices
          # Reference the named list defined in choice_lists above.
          # All questions that share the same choices_ref will use a single
          # dropdown rule in the Excel file (efficient and consistent).
          choices_ref: satisfaction_level
        required: true

      - id: "GEN.Q5"
        text: "How often did you exchange information with the project team?"
        answer:
          type: choices
          choices_ref: frequency
          # show_choices_in_comment: false suppresses the auto-generated option
          # list in column D. Only useful here because no comment: is set;
          # if a comment: were added instead, this flag would be redundant.
          show_choices_in_comment: false
          description: "Frequency of information exchange"
        required: true

      - id: "GEN.Q6"
        text: "Which communication channel did you use most?"
        answer:
          type: choices
          # Inline one-off list: no need to add it to choice_lists.
          choices:
            - "Email"
            - "Video call"
            - "In-person meeting"
            - "Shared document platform"
            - "Other"
        required: false

  # ── Section 2: Technical Quality ───────────────────────────────────────────
  - title: "Technical Quality"
    questions:
      - id: "TECH.Q1"
        text: "How would you rate the technical quality of the provided data and tools?"
        answer:
          type: scale
          min_value: 1
          max_value: 10
          description: "1 = very poor, 5 = adequate, 10 = excellent"
        required: true

      - id: "TECH.Q2"
        text: "Did you experience any significant technical issues during the project?"
        answer:
          type: yes_no
        required: true

      - id: "TECH.Q3"
        text: >
          If you answered 'Yes' to TECH.Q2, please describe the issues
          and how they were resolved.
        answer:
          type: freetext
        comment: "Only fill in if you answered 'Yes' to TECH.Q2"
        required: false

  # ── Section 3: Communication and Support ──────────────────────────────────
  - title: "Communication and Support"
    questions:
      - id: "COM.Q1"
        text: "How would you rate the responsiveness of the organizer's team?"
        answer:
          type: scale
          min_value: 1
          max_value: 5
        required: true

      - id: "COM.Q2"
        text: "Were all your queries and issues addressed in a satisfactory manner?"
        answer:
          type: yes_no
        required: true

      - id: "COM.Q3"
        text: "What could be improved in the communication process?"
        answer:
          type: freetext
        required: false
